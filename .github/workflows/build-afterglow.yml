name: Build AFTERGLOW image (manual)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push tylersabrin/afterglow-studio:1.0.0 to Docker Hub
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required settings
        env:
          DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          CLOUD_BUILDER_NAME: ${{ vars.CLOUD_BUILDER_NAME }}
        run: |
          if [ -z "$DOCKER_ACCESS_TOKEN" ]; then
            echo "::error::Create the DOCKER_ACCESS_TOKEN Actions secret with a Docker Hub personal access token."
            exit 1
          fi
          if [ -z "$CLOUD_BUILDER_NAME" ]; then
            echo "::error::Set the CLOUD_BUILDER_NAME Actions variable to the Docker Build Cloud builder name."
            exit 1
          fi

      - name: Extract and validate source ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path("AFTERGLOW_Studio_Two_Workflow.zip")
          if not archive.is_file():
              raise SystemExit("Expected AFTERGLOW_Studio_Two_Workflow.zip in repository root.")
          dest = Path("buildsrc").resolve()
          with zipfile.ZipFile(archive) as z:
              if sum(item.file_size for item in z.infolist()) > 20 * 1024 * 1024:
                  raise SystemExit("Unexpected package size; stopping.")
              for item in z.infolist():
                  if not (dest / item.filename).resolve().is_relative_to(dest):
                      raise SystemExit("Unsafe ZIP path.")
              z.extractall(dest)
          PY
          python3 buildsrc/afterglow-studio/runpod/validate_package.py

      - name: Sign in to Docker Hub and Docker Build Cloud
        uses: docker/login-action@v4
        with:
          username: tylersabrin
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up remote Docker Build Cloud
        uses: docker/setup-buildx-action@v4
        with:
          driver: cloud
          endpoint: tylersabrin/${{ vars.CLOUD_BUILDER_NAME }}

      - name: Build without publishing
        if: ${{ !inputs.publish }}
        uses: docker/build-push-action@v7
        with:
          context: buildsrc/afterglow-studio
          file: buildsrc/afterglow-studio/runpod/Dockerfile
          platforms: linux/amd64
          tags: tylersabrin/afterglow-studio:1.0.0
          outputs: type=cacheonly

      - name: Build and publish versioned image
        if: inputs.publish
        uses: docker/build-push-action@v7
        with:
          context: buildsrc/afterglow-studio
          file: buildsrc/afterglow-studio/runpod/Dockerfile
          platforms: linux/amd64
          tags: tylersabrin/afterglow-studio:1.0.0
          push: true
